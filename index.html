<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0b1220"/>
<title>MO Iron Eagle</title>
<link rel="manifest" href="manifest.json"/>
<style>
:root{--bg:#0b1220;--card:#162033;--text:#eef3fb;--muted:#9aa8bf;--win:#3dd68c;--loss:#f07178;--warn:#ffb454;--line:#2a3a55;--accent:#59a5ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:var(--bg);color:var(--text);padding:16px;padding-bottom:56px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;line-height:1.45;margin:0 0 8px}
.seg{display:flex;gap:8px;margin:0 0 14px}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:12px;font-size:15px}
.seg button.on{background:var(--accent);color:#041018;border:0;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.k{color:var(--muted);font-size:12px}
.v{font-size:clamp(22px,7vw,34px);font-weight:750;margin-top:6px;letter-spacing:.01em;overflow-wrap:anywhere;word-break:break-word;line-height:1.15}
.win{color:var(--win)}.loss{color:var(--loss)}.warn{color:var(--warn)}
.metrics{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px}
@media (min-width:420px){.metrics{grid-template-columns:1fr 1fr 1fr}}
.metrics .card{margin:0}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.row:last-child{border:0}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px}
.pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11px}
.ok{background:#123528;color:var(--win)}.bad{background:#3a1d24;color:var(--loss)}.wait{background:#3a2a12;color:var(--warn)}
.trig{display:flex;flex-direction:column;gap:8px;align-items:stretch;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.trig:last-child{border:0}
.trig-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.trig .note{margin-top:0;overflow-wrap:anywhere}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.dot.ok{background:var(--win)}.dot.bad{background:var(--loss)}.dot.wait{background:var(--warn)}
.topbar{margin-bottom:8px}
button.refresh{display:block;width:100%;border:0;background:var(--accent);color:#041018;font-weight:700;border-radius:14px;padding:16px 20px;font-size:18px;min-height:56px;margin:12px 0 16px}
.status{font-size:12px;color:var(--muted);margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.grid2 .card{margin:0}
.tiny{font-size:11px;color:var(--muted)}
.chg.up{color:var(--loss)}.chg.down{color:var(--win)}
table.chain{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
table.chain th,table.chain td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.chain th:first-child,table.chain td:first-child{text-align:left}
table.chain th{color:var(--muted);font-weight:600}
table.chain tr.atm td{background:#1c2b44;font-weight:700}
table.chain tr.used td{color:var(--accent)}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
h2{font-size:15px;margin:0 0 8px;font-weight:700}
</style>
</head>
<body>
<div class="topbar">
  <h1>MO Iron Eagle</h1>
  <div class="sub">中证1000短波动 · 手机复盘</div>
</div>
<div class="status" id="status">Loading…</div>
<button class="refresh" id="btn" type="button">刷新 Refresh</button>
<div class="sub">非投资建议。优先新浪实时；拉不到用缓存盘口。</div>

<div class="grid2" id="mkt"></div>
<div class="card" id="fut"></div>
<div class="card" id="chainCard"></div>

<div class="seg">
  <button type="button" id="b3" class="on">3-leg</button>
  <button type="button" id="b4">4-leg</button>
</div>
<div class="metrics" id="trigMetrics"></div>
<div class="card" id="trigCard"></div>
<div id="pnl"></div>
<div class="card" id="legs"></div>
<div class="card note">历史回测回撤参考：3腿 IV&gt;25% ≈ <strong>20.5%</strong>（约¥35万）；4腿封顶 ≈ <strong>¥432,793 (41.6%)</strong>。</div>

<script>
const FALLBACK = {
  asOf: '2026-11-05 10:02 Asia/Shanghai',
  idx: {name:'中证1000', last:6680.53, chg:168.73, pct:2.59},
  im: {last:6619.8, bid:0, ask:0, open:0, high:0, low:0, settle:0, time:''},
  atm: 6600, iv: 0.35,
  chain: {}
};
let mode='3', snap=JSON.parse(JSON.stringify(FALLBACK)), live=false;
const fee=16.5, mult=100;
const STRIKE_OFFS=[-500,-400,-300,-200,-100,0,100,200,300,400,500,600,700,800];

function yen(n){const neg=n<0; const s=Math.round(Math.abs(n)).toLocaleString('en-US'); return (neg?'-':'')+'¥'+s;}
function fmt(n,d=1){if(n==null||isNaN(n)||n===0) return '—'; return (+n).toFixed(d);}
function setMode(m){mode=m;document.getElementById('b3').classList.toggle('on',m==='3');document.getElementById('b4').classList.toggle('on',m==='4');render();}
document.getElementById('b3').onclick=()=>setMode('3');
document.getElementById('b4').onclick=()=>setMode('4');
document.getElementById('btn').onclick=()=>pull();

function parseOpt(s){if(!s) return null; const p=s.split(','); return {bvol:+p[0]||0,bid:+p[1]||0,last:+p[2]||0,ask:+p[3]||0,svol:+p[4]||0};}
function parseFut(s){if(!s) return null; const p=s.split(',');
  return {open:+p[0]||0,high:+p[1]||0,low:+p[2]||0,last:+p[3]||0,settle:+p[14]||0,bid:+p[16]||0,ask:+p[26]||0,time:((p[36]||'')+' '+(p[37]||'')).trim(),name:p[p.length-1]||'IM'};}
function parseIdx(s){if(!s) return null; const p=s.split(','); return {name:p[0], last:+p[1]||0, chg:+p[2]||0, pct:+p[3]||0};}

function getOpt(cp,k){
  const key=(cp==='P'?'P':'C')+k;
  return (snap.chain&&snap.chain[key]) || null;
}
function mid(o){if(!o) return 0; if(o.bid&&o.ask) return (o.bid+o.ask)/2; return o.last||o.bid||o.ask||0;}

function compute(){
  const atm=snap.atm;
  const sp=getOpt('P',atm-100)||{bid:0,ask:0};
  const lp=getOpt('P',atm-500)||{bid:0,ask:0};
  const sc3=getOpt('C',atm+300)||{bid:0,ask:0};
  const sc4=getOpt('C',atm+400)||{bid:0,ask:0};
  const lc4=getOpt('C',atm+800)||{bid:0,ask:0};
  const credit3=(sp.bid||0)+(sc3.bid||0)-(lp.ask||0);
  const credit4=(sp.bid||0)+(sc4.bid||0)-(lp.ask||0)-(lc4.ask||0);
  const maxWin3=credit3*mult-3*fee, maxLossDown=(400-credit3)*mult+3*fee;
  const maxWin4=credit4*mult-4*fee, maxLoss4=(400-credit4)*mult+4*fee;
  const ivOk=snap.iv>0.25;
  return {atm,sp,lp,sc3,sc4,lc4,credit3,credit4,maxWin3,maxLossDown,maxWin4,maxLoss4,ivOk,passed:(ivOk?1:0)+2,blocked:1,waiting:2};
}

function usedStrike(k,c){
  if(mode==='3') return [c.atm-100,c.atm-500,c.atm+300].includes(k);
  return [c.atm-100,c.atm-500,c.atm+400,c.atm+800].includes(k);
}

function render(){
  const c=compute();
  const idx=snap.idx||{};
  const im=snap.im||{};
  document.getElementById('status').textContent=(live?'Live 新浪 · ':'缓存 · ')+(snap.asOf||im.time||'');

  const chgCls=(idx.pct||0)>=0?'up':'down';
  document.getElementById('mkt').innerHTML=`
    <div class="card"><div class="k">${idx.name||'中证1000'}</div><div class="v">${fmt(idx.last,2)}</div>
      <div class="tiny chg ${chgCls}">${(idx.chg>=0?'+':'')+fmt(idx.chg,2)} · ${(idx.pct>=0?'+':'')+fmt(idx.pct,2)}%</div></div>
    <div class="card"><div class="k">ATM IV</div><div class="v">${(snap.iv*100).toFixed(1)}%</div>
      <div class="tiny">ATM ${c.atm} · IM ${fmt(im.last,1)}</div></div>`;

  document.getElementById('fut').innerHTML=`
    <h2>期货 IM2611</h2>
    <div class="row"><span>最新</span><strong>${fmt(im.last,1)}</strong></div>
    <div class="row"><span>买一 / 卖一</span><span>${fmt(im.bid,1)} / ${fmt(im.ask,1)}</span></div>
    <div class="row"><span>开 / 高 / 低</span><span>${fmt(im.open,1)} / ${fmt(im.high,1)} / ${fmt(im.low,1)}</span></div>
    <div class="row"><span>结算参考</span><span>${fmt(im.settle,1)}</span></div>
    <div class="note">${im.time||snap.asOf||''}</div>`;

  let rows='';
  for(const off of STRIKE_OFFS){
    const k=c.atm+off;
    const p=getOpt('P',k), call=getOpt('C',k);
    const cls=(k===c.atm?'atm':'')+(usedStrike(k,c)?' used':'');
    rows+=`<tr class="${cls}"><td>${k}${k===c.atm?' ★':''}</td>
      <td>${p?fmt(p.bid,1):'—'}</td><td>${p?fmt(p.last,1):'—'}</td><td>${p?fmt(p.ask,1):'—'}</td>
      <td>${call?fmt(call.bid,1):'—'}</td><td>${call?fmt(call.last,1):'—'}</td><td>${call?fmt(call.ask,1):'—'}</td></tr>`;
  }
  document.getElementById('chainCard').innerHTML=`
    <h2>期权链 MO2611</h2>
    <div class="tiny">围绕 ATM±；蓝色行为策略腿。左 Put · 右 Call</div>
    <div class="scrollx"><table class="chain">
      <thead><tr><th>行权价</th><th>P买</th><th>P最新</th><th>P卖</th><th>C买</th><th>C最新</th><th>C卖</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;

  document.getElementById('trigMetrics').innerHTML=`
    <div class="card"><div class="k">Passed</div><div class="v win">${c.passed}</div></div>
    <div class="card"><div class="k">Not clear</div><div class="v warn">${c.blocked}</div></div>
    <div class="card"><div class="k">Waiting</div><div class="v warn">${c.waiting}</div></div>`;
  document.getElementById('trigCard').innerHTML=`
    <div class="k">Entry triggers</div>
    <div class="trig"><div class="trig-head"><span class="dot ok"></span><span>IV &gt; 25%</span><span class="pill ok">passed</span></div><div class="note">ATM IV ≈ ${(snap.iv*100).toFixed(1)}%</div></div>
    <div class="trig"><div class="trig-head"><span class="dot ok"></span><span>Days left &gt; 5</span><span class="pill ok">passed</span></div><div class="note">MO2611 → 2026-11-20 (~11 trading days)</div></div>
    <div class="trig"><div class="trig-head"><span class="dot ok"></span><span>Near-month quotes OK</span><span class="pill ok">passed</span></div></div>
    <div class="trig"><div class="trig-head"><span class="dot bad"></span><span>IV down 2 hours in a row</span><span class="pill bad">not verified</span></div><div class="note">Need consecutive hour IV bars</div></div>
    <div class="trig"><div class="trig-head"><span class="dot wait"></span><span>No take-profit month block</span><span class="pill wait">waiting</span></div><div class="note">Tell me your open positions</div></div>
    <div class="trig"><div class="trig-head"><span class="dot wait"></span><span>Stack &lt; 3 groups</span><span class="pill wait">waiting</span></div></div>
    <div class="note"><strong>Bottom line:</strong> 3/6 passed — not a full go-signal under strict rules.</div>`;

  if(mode==='3'){
    document.getElementById('pnl').innerHTML=`
      <div class="card"><div class="k">最多能赚</div><div class="v win">${yen(c.maxWin3)}</div><div class="note">保留全部权利金 ${c.credit3.toFixed(1)} 点</div></div>
      <div class="card"><div class="k">下行最差</div><div class="v loss">${yen(c.maxLossDown)}</div><div class="note">400点 put 翼 − 权利金</div></div>
      <div class="card"><div class="k">上行最差</div><div class="v loss">Unlimited</div><div class="note">3腿无保护 call</div></div>`;
  } else {
    document.getElementById('pnl').innerHTML=`
      <div class="card"><div class="k">最多能赚</div><div class="v win">${yen(c.maxWin4)}</div><div class="note">权利金 ${c.credit4.toFixed(1)} 点</div></div>
      <div class="card"><div class="k">两侧最差</div><div class="v loss">${yen(c.maxLoss4)}</div><div class="note">400点翼 − 权利金（封顶）</div></div>`;
  }
  document.getElementById('legs').innerHTML=`
    <div class="k">结构 · IM ${fmt(im.last,1)} · ATM ${c.atm}</div>
    <div class="row"><span>Sell P${c.atm-100}</span><span>${fmt(c.sp.bid,1)} × ${c.sp.bvol||0}</span></div>
    <div class="row"><span>Buy P${c.atm-500}</span><span>${fmt(c.lp.ask,1)} × ${c.lp.svol||0}</span></div>
    <div class="row"><span>${mode==='3'?'Sell C'+(c.atm+300):'Sell C'+(c.atm+400)}</span><span>${fmt((mode==='3'?c.sc3:c.sc4).bid,1)}</span></div>
    ${mode==='4'?`<div class="row"><span>Buy C${c.atm+800}</span><span>${fmt(c.lc4.ask,1)}</span></div>`:''}
    <div class="row"><span>保守权利金</span><strong>${(mode==='3'?c.credit3:c.credit4).toFixed(1)} 点</strong></div>`;
}

function seedFallbackChain(){
  // morning snapshot legs only
  const base={
    P6500:{bvol:7,bid:137.8,last:137.6,ask:138.6,svol:2},
    P6100:{bvol:10,bid:38.4,last:38.6,ask:38.6,svol:6},
    C6900:{bvol:15,bid:79.0,last:80.2,ask:80.2,svol:4},
    C7000:{bvol:3,bid:57.2,last:57.4,ask:57.6,svol:11},
    C7400:{bvol:18,bid:12.8,last:13.2,ask:13.0,svol:1},
    P6600:{bvol:0,bid:0,last:0,ask:0,svol:0},
    C6600:{bvol:0,bid:0,last:0,ask:0,svol:0},
  };
  FALLBACK.chain=base; snap.chain=JSON.parse(JSON.stringify(base));
}
seedFallbackChain();

function pull(){
  document.getElementById('status').textContent='Refreshing…';
  // first pull index+fut to get ATM, then chain — single list with wide band around likely ATM
  const guess=snap.atm||6600;
  const strikes=[];
  for(let k=guess-600;k<=guess+900;k+=100) strikes.push(k);
  const opts=[];
  for(const k of strikes){ opts.push('P_OP_mo2611P'+k,'P_OP_mo2611C'+k); }
  const list=['s_sh000852','nf_IM2611'].concat(opts).join(',');
  const s=document.createElement('script');
  s.src='https://hq.sinajs.cn/list='+list+'&_='+Date.now();
  s.charset='gbk';
  s.onload=()=>{
    try{
      const idx=parseIdx(window.hq_str_s_sh000852||'');
      const im=parseFut(window.hq_str_nf_IM2611||'');
      const last=im&&im.last?im.last:(idx&&idx.last?idx.last:6600);
      const atm=Math.round(last/100)*100;
      const chain={};
      for(const off of STRIKE_OFFS){
        const k=atm+off;
        const p=parseOpt(window['hq_str_P_OP_mo2611P'+k]);
        const c=parseOpt(window['hq_str_P_OP_mo2611C'+k]);
        if(p) chain['P'+k]=p;
        if(c) chain['C'+k]=c;
      }
      snap={asOf:(im&&im.time)||new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}),
        idx:idx||snap.idx, im:im||snap.im, atm, iv:snap.iv, chain};
      live=true; render();
    }catch(e){
      document.getElementById('status').textContent='Live pull failed, showing cache';
      live=false; render();
    }
    s.remove();
  };
  s.onerror=()=>{ document.getElementById('status').textContent='Live pull blocked — cached snapshot'; live=false; render(); s.remove(); };
  document.body.appendChild(s);
}
render(); pull(); setInterval(pull, 300000);
</script>
</body>
</html>
